[project]
name = "lease-decision-lab"
version = "0.1.0"
description = "Local, fictional lease decision and uncertainty laboratory"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.2,<3", "scipy>=1.15,<2", "scikit-learn>=1.6,<2",
  "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff==0.14.4",
]

[project.scripts]
lease-lab = "lease_lab.cli:main"

[project.optional-dependencies]
challenger = [
    "tabpfn==9.2.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lease_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
exclude-newer = "2026-10-25T00:00:00Z"
